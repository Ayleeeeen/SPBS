<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuSale</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<section class="splash" id="splash">
  <div class="splash-center">
    <img src="logo.svg" alt="AuSale" class="splash-logo">
    <h1>AuSale</h1>
    <p>Tu bodega, simple y al día</p>
  </div>
  <button class="splash-btn" id="start">Empezar</button>
</section>
<div class="shell">
  <header class="topbar">
    <div class="brand"><img src="logo.svg" alt="" width="26" height="26"> AuSale</div>
    <nav id="nav">
      <button data-view="sale" class="active">Venta</button>
      <button data-view="products">Productos</button>
      <button data-view="prices">Precios</button>
      <button data-view="sales">Ventas y reportes</button>
    </nav>
    <div class="clock" id="clock"></div>
  </header>
  <main id="view"></main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js" type="module"></script>
</body>
</html>
